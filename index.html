      function applyPhotoToRegisterForm(overwrite) {
        if (!state.photoDraft || !state.photoDraft.analysis) return;
        var pa = state.photoDraft.analysis;
        var colorInput = document.getElementById("itemColor");
        var featuresInput = document.getElementById("itemFeatures");
        if (colorInput && (overwrite || !colorInput.value.trim())) {
          colorInput.value = pa.dominantColor;
        }
        if (featuresInput && (overwrite || !featuresInput.value.trim())) {
          featuresInput.value =
            pa.dominantColor +
            (pa.secondaryColor ? "과 " + pa.secondaryColor + " 조합, " : " 계열, ") +
            pa.tone +
            "의 " +
            pa.shapeNote +
            "입니다.";
        }
      }

      function handleRegisterPhotoSelect(file) {
        if (!file) return;
        processImageFile(file)
          .then(function (result) {
            state.photoDraft = result;
            state.registerError = "";
            // Preserve user's currently typed fields before re-rendering
            var snapshot = captureRegisterFormValues();
            render();
            restoreRegisterFormValues(snapshot);
            applyPhotoToRegisterForm(false);
            showToast("사진에서 '" + result.analysis.dominantColor + "' 색상을 읽었습니다.");
          })
          .catch(function (err) {
            state.registerError = err.message || "사진 처리에 실패했습니다.";
            var snapshot = captureRegisterFormValues();
            render();
            restoreRegisterFormValues(snapshot);
          });
      }

      function captureRegisterFormValues() {
        var form = document.getElementById("registerForm");
        if (!form) return null;
        return {
          name: form.name.value,
          category: form.category.value,
          color: form.color.value,
          date: form.date.value,
          location: form.location.value,
          features: form.features.value
        };
      }

      function restoreRegisterFormValues(snap) {
        var form = document.getElementById("registerForm");
        if (!form || !snap) return;
        if (snap.name) form.name.value = snap.name;
        if (snap.category) form.category.value = snap.category;
        if (snap.color) form.color.value = snap.color;
        if (snap.date) form.date.value = snap.date;
        if (snap.location) form.location.value = snap.location;
        if (snap.features) form.features.value = snap.features;
      }

      function bindRegisterEvents() {
        document.getElementById("segLostBtn").addEventListener("click", function () {
          var snap = captureRegisterFormValues();
          state.registerType = "lost";
          state.registerError = "";
          render();
          restoreRegisterFormValues(snap);
        });
        document.getElementById("segFoundBtn").addEventListener("click", function () {
          var snap = captureRegisterFormValues();
          state.registerType = "found";
          state.registerError = "";
          render();
          restoreRegisterFormValues(snap);
        });
        document.getElementById("regCancelBtn").addEventListener("click", function () {
          setView("list");
        });

        var up1 = document.getElementById("regPhotoUpload");
        var up2 = document.getElementById("regPhotoCamera");
        if (up1) {
          up1.addEventListener("change", function () {
            if (this.files && this.files[0]) handleRegisterPhotoSelect(this.files[0]);
          });
        }
        if (up2) {
          up2.addEventListener("change", function () {
            if (this.files && this.files[0]) handleRegisterPhotoSelect(this.files[0]);
          });
        }

        var previewMatchBtn = document.getElementById("previewPhotoMatchBtn");
        if (previewMatchBtn) {
          previewMatchBtn.addEventListener("click", function () {
            if (!state.photoDraft) return;
            var snap = captureRegisterFormValues() || {};
            var pa = state.photoDraft.analysis;
            var previewItem = {
              id: "preview-" + Date.now(),
              type: "lost",
              source: "user",
              name: (snap.name && snap.name.trim()) || (pa.dominantColor + " 물건 (사진 미리보기)"),
              category: snap.category || "기타",
              color: (snap.color && snap.color.trim()) || pa.dominantColor,
              location: (snap.location && snap.location.trim()) || "위치 미입력",
              date: snap.date || getRelativeDate(0),
              features: (snap.features && snap.features.trim()) || pa.summary,
              status: "찾는 중",
              photoDataUrl: state.photoDraft.dataUrl,
              photoAnalysis: pa
            };
            var foundItems = state.items.filter(function (it) {
              return it.type === "found";
            });
            loadingModal.classList.add("open");
            setTimeout(function () {
              var evaluated = foundItems
                .map(function (f) {
                  return compareLostWithFound(previewItem, f);
                })
                .sort(function (a, b) {
                  return b.rankScore - a.rankScore;
                });
              loadingModal.classList.remove("open");
              openAnalysisRecord({
                id: "an-preview-" + Date.now(),
                createdAt: Date.now(),
                lostItemId: previewItem.id,
                lostSnapshot: previewItem,
                comparedCount: foundItems.length,
                candidates: evaluated.slice(0, 4)
              });
            }, 450);
          });
        }

        var applyBtn = document.getElementById("applyPhotoAnalysisBtn");
        if (applyBtn) {
          applyBtn.addEventListener("click", function () {
            applyPhotoToRegisterForm(true);
            showToast("사진 색상과 외형 설명을 다시 반영했습니다.");
          });
        }

        var removeBtn = document.getElementById("removeDraftPhotoBtn");
        if (removeBtn) {
          removeBtn.addEventListener("click", function () {
            var snap = captureRegisterFormValues();
            state.photoDraft = null;
            render();
            restoreRegisterFormValues(snap);
          });
        }

        var submitMode = "save";
        var submitButtons = document.querySelectorAll('#registerForm button[type="submit"]');
        for (var i = 0; i < submitButtons.length; i++) {
          submitButtons[i].addEventListener("click", function () {
            submitMode = this.getAttribute("data-submit-mode") || "save";
          });
        }

        document.getElementById("registerForm").addEventListener("submit", function (e) {
          e.preventDefault();
          var name = this.name.value.trim();
          var category = this.category.value;
          var color = this.color.value.trim();
          var date = this.date.value;
          var location = this.location.value.trim();
          var features = this.features.value.trim();

          var snap = { name: name, category: category, color: color, date: date, location: location, features: features };

          function fail(msg) {
            state.registerError = msg;
            render();
            restoreRegisterFormValues(snap);
          }

          if (!name) return fail("물건 이름을 입력해주세요.");
          if (!color) return fail("물건 색상을 입력해주세요.");
          if (!location) return fail(state.registerType === "lost" ? "분실 장소를 입력해주세요." : "발견 및 보관 장소를 입력해주세요.");
          if (!date) return fail("날짜를 선택해주세요.");
          if (date > getRelativeDate(0)) return fail("오늘보다 미래의 날짜는 선택할 수 없습니다.");
          if (features.length < 5) return fail("외형과 특징을 5글자 이상 구체적으로 입력해주세요.");

          var piiErr = detectPersonalInfo(name + " " + location + " " + features);
          if (piiErr) return fail(piiErr);

          var newItem = {
            id: "user-" + Date.now(),
            type: state.registerType,
            source: "user",
            name: name,
            category: category,
            color: color,
            location: location,
            date: date,
            features: features,
            status: state.registerType === "lost" ? "찾는 중" : "보관 중",
            photoDataUrl: state.photoDraft ? state.photoDraft.dataUrl : "",
            photoAnalysis: state.photoDraft ? state.photoDraft.analysis : null,
            createdAt: Date.now()
          };

          state.items.unshift(newItem);
          saveItems(state.items);
          state.photoDraft = null;
          state.registerError = "";

          state.filters.type = "all";
          state.filters.source = "all";
          state.filters.status = "all";

          showToast((state.registerType === "lost" ? "분실물" : "발견물") + "이 안전하게 등록되었습니다.");
          setView("list");

          if (state.registerType === "lost" && submitMode === "analyze") {
            runAnalysisForLostItem(newItem.id);
          }
        });
      }

      function bindDirectoryResultEvents() {
        var resetFiltersBtn = document.getElementById("resetFiltersBtn");
        if (resetFiltersBtn) {
          resetFiltersBtn.addEventListener("click", function () {
            state.filters = { search: "", type: "all", source: "all", category: "all", status: "all", photoOnly: false };
            render();
          });
        }
        var emptyRegisterBtn = document.getElementById("emptyRegisterBtn");
        if (emptyRegisterBtn) {
          emptyRegisterBtn.addEventListener("click", function () {
            setView("register");
          });
        }

        var resultsRoot = document.getElementById("directoryResults") || appMain;
        resultsRoot.querySelectorAll("[data-action]").forEach(function (el) {
          el.addEventListener("click", function () {
            var action = this.getAttribute("data-action");
            var id = this.getAttribute("data-id");

            if (action === "set-status") {
              updateItemStatus(id, this.getAttribute("data-status"));
            } else if (action === "analyze-item") {
              runAnalysisForLostItem(id);
            } else if (action === "view-last-analysis") {
              for (var a = 0; a < state.analyses.length; a++) {
                if (state.analyses[a].lostItemId === id) {
                  openAnalysisRecord(state.analyses[a]);
                  break;
                }
              }
            } else if (action === "open-lightbox") {
              for (var b = 0; b < state.items.length; b++) {
                if (state.items[b].id === id) {
                  openLightbox(state.items[b]);
                  break;
                }
              }
            } else if (action === "attach-card-photo") {
              state.pendingCardPhotoItemId = id;
              cardPhotoInput.value = "";
              cardPhotoInput.click();
            } else if (action === "remove-card-photo") {
              for (var r = 0; r < state.items.length; r++) {
                if (state.items[r].id === id) {
                  state.items[r].photoDataUrl = "";
                  state.items[r].photoAnalysis = null;
                  break;
                }
              }
              saveItems(state.items);
              showToast("등록된 사진을 삭제했습니다.");
              render();
            } else if (action === "ask-delete") {
              state.pendingDeleteId = id;
              render();
            } else if (action === "cancel-delete") {
              state.pendingDeleteId = null;
              render();
            } else if (action === "confirm-delete") {
              state.items = state.items.filter(function (it) {
                return it.id !== id;
              });
              state.pendingDeleteId = null;
              saveItems(state.items);
              showToast("등록한 물건을 삭제했습니다.");
              render();
            }
          });
        });
      }

      function bindDirectoryEvents() {
        var searchInput = document.getElementById("searchInput");
        if (searchInput) {
          searchInput.addEventListener("input", function () {
            state.filters.search = this.value;
            var resultsEl = document.getElementById("directoryResults");
            if (resultsEl) {
              resultsEl.innerHTML = renderDirectoryResultsMarkup();
              bindDirectoryResultEvents();
            }
          });
        }

        var typeBtns = document.querySelectorAll("[data-filter-type]");
        for (var i = 0; i < typeBtns.length; i++) {
          typeBtns[i].addEventListener("click", function () {
            state.filters.type = this.getAttribute("data-filter-type");
            render();
          });
        }

        var sourceBtns = document.querySelectorAll("[data-filter-source]");
        for (var j = 0; j < sourceBtns.length; j++) {
          sourceBtns[j].addEventListener("click", function () {
            state.filters.source = this.getAttribute("data-filter-source");
            render();
          });
        }

        document.getElementById("categoryFilter").addEventListener("change", function () {
          state.filters.category = this.value;
          render();
        });
        document.getElementById("statusFilter").addEventListener("change", function () {
          state.filters.status = this.value;
          render();
        });
        document.getElementById("photoOnlyFilter").addEventListener("change", function () {
          state.filters.photoOnly = this.checked;
          render();
        });

        document.getElementById("dirNewRegisterBtn").addEventListener("click", function () {
          setView("register");
        });

        var askResetBtn = document.getElementById("askResetExampleBtn");
        if (askResetBtn) {
          askResetBtn.addEventListener("click", function () {
            state.pendingResetExample = true;
            render();
          });
        }
        var cancelResetBtn = document.getElementById("cancelResetExampleBtn");
        if (cancelResetBtn) {
          cancelResetBtn.addEventListener("click", function () {
            state.pendingResetExample = false;
            render();
          });
        }
        var confirmResetBtn = document.getElementById("confirmResetExampleBtn");
        if (confirmResetBtn) {
          confirmResetBtn.addEventListener("click", function () {
            var userOnly = state.items.filter(function (it) {
              return it.source === "user";
            });
            state.items = userOnly.concat(createSeedItems());
            saveItems(state.items);
            state.pendingResetExample = false;
            showToast("예시 데이터를 기본 상태로 복원했습니다.");
            render();
          });
        }

        bindDirectoryResultEvents();
      }

      function bindHistoryEvents() {
        var goList = document.getElementById("historyGoListBtn");
        if (goList) {
          goList.addEventListener("click", function () {
            setView("list");
          });
        }
        appMain.querySelectorAll("[data-action]").forEach(function (el) {
          el.addEventListener("click", function () {
            var action = this.getAttribute("data-action");
            var hid = this.getAttribute("data-history-id");
            if (action === "open-history-record") {
              for (var i = 0; i < state.analyses.length; i++) {
                if (state.analyses[i].id === hid) {
                  openAnalysisRecord(state.analyses[i]);
                  break;
                }
              }
            } else if (action === "delete-history-record") {
              state.analyses = state.analyses.filter(function (rec) {
                return rec.id !== hid;
              });
              saveAnalyses(state.analyses);
              showToast("분석 기록을 삭제했습니다.");
              render();
            }
          });
        });
      }

      function buildCleanStandaloneHtml() {
        var clone = document.documentElement.cloneNode(true);
        var mainEl = clone.querySelector("#appMain");
        if (mainEl) mainEl.innerHTML = "";
        var navEls = clone.querySelectorAll("[data-nav]");
        for (var i = 0; i < navEls.length; i++) {
          navEls[i].classList.remove("active");
        }
        var c1 = clone.querySelector("#navItemCount");
        if (c1) c1.textContent = "0";
        var c2 = clone.querySelector("#navHistoryCount");
        if (c2) c2.textContent = "0";
        var modals = clone.querySelectorAll(".modal-backdrop");
        for (var m = 0; m < modals.length; m++) {
          modals[m].classList.remove("open");
        }
        var mBody = clone.querySelector("#analysisModalBody");
        if (mBody) mBody.innerHTML = "";
        var mFoot = clone.querySelector("#analysisModalFoot");
        if (mFoot) mFoot.innerHTML = "";
        var lbImg = clone.querySelector("#lightboxImg");
        if (lbImg) lbImg.removeAttribute("src");
        var toast = clone.querySelector("#toast");
        if (toast) {
          toast.classList.remove("show");
          toast.textContent = "";
        }
        return "<!doctype html>\n" + clone.outerHTML + "\n";
      }

      function downloadStandaloneIndexHtml() {
        try {
          var htmlText = buildCleanStandaloneHtml();
          var blob = new Blob([htmlText], { type: "text/html;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var link = document.createElement("a");
          link.href = url;
          link.download = "index.html";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
          showToast("index.html 파일 다운로드를 시작했습니다.");
        } catch (err) {
          showToast("파일 다운로드가 제한된 환경이라면 '전체 HTML 복사'를 이용해주세요.");
        }
      }

      function copyStandaloneIndexHtml() {
        var htmlText = buildCleanStandaloneHtml();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(htmlText)
            .then(function () {
              showToast("전체 index.html 코드를 클립보드에 복사했습니다.");
            })
            .catch(function () {
              showToast("클립보드 복사에 실패했습니다. 'index.html 다운로드'를 눌러주세요.");
            });
        } else {
          showToast("이 환경에서는 클립보드 자동 복사가 지원되지 않습니다.");
        }
      }

      // Global Header / Nav / Modal Listeners
      document.getElementById("brandBtn").addEventListener("click", function () {
        setView("home");
      });
      var headerDownloadBtn = document.getElementById("headerDownloadHtmlBtn");
      if (headerDownloadBtn) {
        headerDownloadBtn.addEventListener("click", downloadStandaloneIndexHtml);
      }
      document.getElementById("headerRegisterCta").addEventListener("click", function () {
        setView("register");
      });

      var allNavBtns = document.querySelectorAll("[data-nav]");
      for (var n = 0; n < allNavBtns.length; n++) {
        allNavBtns[n].addEventListener("click", function () {
          setView(this.getAttribute("data-nav"));
        });
      }

      cardPhotoInput.addEventListener("change", function () {
        var file = this.files && this.files[0];
        var targetId = state.pendingCardPhotoItemId;
        if (!file || !targetId) return;
        processImageFile(file)
          .then(function (res) {
            for (var i = 0; i < state.items.length; i++) {
              if (state.items[i].id === targetId) {
                state.items[i].photoDataUrl = res.dataUrl;
                state.items[i].photoAnalysis = res.analysis;
                break;
              }
            }
            saveItems(state.items);
            state.pendingCardPhotoItemId = null;
            showToast("사진과 색상 분석(" + res.analysis.dominantColor + ")을 저장했습니다.");
            render();
          })
          .catch(function (err) {
            state.pendingCardPhotoItemId = null;
            showToast(err.message || "사진 추가에 실패했습니다.");
          });
      });

      document.getElementById("closeAnalysisModalBtn").addEventListener("click", closeAnalysisModal);
      analysisModal.addEventListener("click", function (e) {
        if (e.target === analysisModal) closeAnalysisModal();
      });

      document.getElementById("closeLightboxBtn").addEventListener("click", function () {
        lightboxModal.classList.remove("open");
      });
      lightboxModal.addEventListener("click", function (e) {
        if (e.target === lightboxModal) lightboxModal.classList.remove("open");
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          closeAnalysisModal();
          lightboxModal.classList.remove("open");
        }
      });

      // Expose pure helpers on window only for quick automated unit checks when needed (no sensitive data)
      window.__chajajwoLogic = {
        detectPersonalInfo: detectPersonalInfo,
        escapeHtml: escapeHtml,
        classifyRgbToKoreanColor: classifyRgbToKoreanColor,
        compareLostWithFound: compareLostWithFound
      };

      render();
    })();
  </script>
